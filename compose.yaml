# Runs Ricette from this repository with a SQLite database kept in a volume.
# The application key is created on first start and kept in the data volume; see docs/operations/deployment.md.
services:
  ricette:
    build: .
    image: ricette
    ports:
      - "8080:8080"
    environment:
      # Uncomment to close registration once your own account exists.
      # REGISTRATION_ENABLED: "false"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ricette-data:/data
    restart: unless-stopped

volumes:
  ricette-data:
