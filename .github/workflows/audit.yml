name: audit

# The full-tree known-vulnerability audit (composer audit, pnpm audit). It is deliberately NOT a pull-request check:
# an advisory published against a dependency already on main would fail every open PR, including the Dependabot PR
# that fixes it, so the fix could never merge. What a PR must not do is introduce a vulnerability, and the required
# `dependency-review` check already answers that by diffing the PR's dependencies against its base. This workflow
# answers the other question -- "is anything on main vulnerable today?" -- on a schedule and on every push to main,
# and keeps one issue open while the answer is yes (the same posture as bin/track-findings for the published image).
on:
  schedule:
    - cron: "43 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: audit
        continue-on-error: true
        run: set -o pipefail; ./bin/verify composer-audit 2>&1 | tee "$RUNNER_TEMP/audit.log"
      # One issue, opened on the first failure, refreshed while it persists, closed when the audit is clean again.
      - name: Track the result in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency audit: known vulnerabilities on main"
          gh label create vulnerability --description "A known vulnerability (managed by CI)" --color B60205 >/dev/null 2>&1 || true
          number=$(gh api --paginate --slurp "repos/{owner}/{repo}/issues?labels=vulnerability&state=open&per_page=100" |
            jq -r --arg t "$title" '[.[][] | select((.pull_request | not) and .title == $t)][0].number // empty')
          if [ "$RESULT" = success ]; then
            [ -z "$number" ] || gh issue close "$number" --comment "The audit is clean again ($RUN_URL)."
            exit 0
          fi
          fence='```'
          {
            echo "The dependency audit found known vulnerabilities ($RUN_URL)."
            echo
            echo "This does not block pull requests: Dependabot bumps are how these get fixed."
            echo "This issue is opened, refreshed and closed automatically."
            echo
            echo "$fence"
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/audit.log" | tail -c 20000
            echo "$fence"
          } >"$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --label vulnerability --body-file "$RUNNER_TEMP/body.md"
          fi
          exit 1
