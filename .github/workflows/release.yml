name: release

# Decides WHEN to publish; publish.yml does the publishing (ADR-0017, ADR-0029).
#   nightly  every day: the moving :nightly tag, only if main changed
#   release  every Monday: a semantic version, only if something that reaches the image changed, or the base image did
# bin/release-plan makes the decisions; this file only asks it and carries them out.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      kind:
        description: What to publish
        type: choice
        options: [nightly, release]
        default: nightly

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/smilerz/ricette

jobs:
  plan:
    name: plan
    if: github.repository == 'smilerz/ricette' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      reason: ${{ steps.plan.outputs.reason }}
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      git_tag: ${{ steps.plan.outputs.git_tag }}
      tags: ${{ steps.plan.outputs.tags }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            kind=$INPUT_KIND
          elif [ "$SCHEDULE" = "17 4 * * 1" ]; then
            kind=release
          else
            kind=nightly
          fi

          # Has the base image changed since the last published image was built? (Recorded as an annotation on the image.)
          base=$(awk '/^FROM .* AS php-base/ {print $2}' Dockerfile)
          now_base=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          published_base() { # published_base <tag>: the base digest recorded on that image; empty when there is no such image
            docker buildx imagetools inspect "$IMAGE:$1" --raw 2>/dev/null | jq -r '.annotations["org.ricette.base-digest"] // empty' || true
          }

          if [ "$kind" = release ]; then
            # A tag whose image never got published must be fixed first, loudly, not skipped over.
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD | sort -V | tail -1)
            if [ -n "$last" ] && ! docker buildx imagetools inspect "$IMAGE:${last#v}" >/dev/null 2>&1; then
              echo "::error::$last exists but $IMAGE:${last#v} was never published. Re-run it: Actions, publish, Run workflow, tag=$last. Until then no new release is cut."
              exit 1
            fi
            old_base=$(published_base latest)
            if [ -n "$old_base" ] && [ "$old_base" != "$now_base" ]; then
              export REBUILD_REASON="base image changed from ${old_base:0:19} to ${now_base:0:19}"
            fi
          else
            last_sha=$(docker buildx imagetools inspect "$IMAGE:nightly" --raw 2>/dev/null | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
            old_base=$(published_base nightly)
            # A changed base image is a reason to rebuild even though main did not move.
            if [ -n "$old_base" ] && [ "$old_base" != "$now_base" ]; then last_sha=''; fi
            export LAST_NIGHTLY_SHA=$last_sha
          fi

          # Never overwrite a version that already exists in the registry, whatever git says.
          ./bin/release-plan "$kind" | tee plan.out
          if [ "$kind" = release ] && grep -q '^skip=false' plan.out; then
            version=$(sed -n 's/^version=//p' plan.out)
            if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$version already exists in the registry but has no git tag. Refusing to overwrite it."
              exit 1
            fi
          fi
          cat plan.out >>"$GITHUB_OUTPUT"

  tag:
    name: tag
    needs: plan
    if: needs.plan.outputs.skip == 'false' && needs.plan.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: true
      # The tag is the commit point: once it exists the release is decided, and a failed publish is re-run for this tag.
      # NOTE: a tag pushed with the default GITHUB_TOKEN does not start other workflows, which is what we want here, because
      # the publish below is called explicitly. If this step ever moves to a personal access token or an app token, the push
      # WILL trigger publish.yml (it listens for v* tags) and every release will publish twice.
      - name: Create and push the tag
        env:
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GIT_TAG" -m "Release $GIT_TAG" "$SHA"
          git push origin "refs/tags/$GIT_TAG"

  publish-release:
    name: publish release
    needs: [plan, tag]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/publish.yml
    with:
      kind: release
      tag: ${{ needs.plan.outputs.git_tag }}

  publish-nightly:
    name: publish nightly
    needs: plan
    if: needs.plan.outputs.skip == 'false' && needs.plan.outputs.kind == 'nightly'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
    uses: ./.github/workflows/publish.yml
    with:
      kind: nightly
      sha: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      tags: ${{ needs.plan.outputs.tags }}
