name: container

on:
  pull_request:
  push:
    branches: [main]
  # New advisories appear without any change here, so the image is rebuilt and scanned weekly.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The jobs below always run and always report, so they can stay required checks. When a pull request
  # touches only documentation, tests or editor settings, their steps are skipped and they pass quickly.
  # Anything else, and every push to main and scheduled run, builds and tests the image.
  changes:
    name: container-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          relevant=true
          if [ "$EVENT" = pull_request ]; then
            others=$(git diff --name-only "$BASE" "$HEAD" | grep -Ev '^(docs/|tests/|\.vscode/|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md|CODEOWNERS)|[^/]+\.md$)' || true)
            [ -z "$others" ] && relevant=false
            echo "Files that need the image:"; echo "${others:-none}"
          fi
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"

  # Each architecture builds natively (no emulation) and keeps its own layer cache.
  container-build:
    name: container-build (${{ matrix.arch }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.relevant == 'true'
      - name: Build linux/${{ matrix.arch }}
        if: needs.changes.outputs.relevant == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ricette:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Report image size
        if: needs.changes.outputs.relevant == 'true'
        run: |
          size=$(docker image inspect ricette:${{ matrix.arch }} --format '{{.Size}}')
          echo "ricette:${{ matrix.arch }} is $((size / 1024 / 1024)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          docker history --format '{{.Size}}\t{{.CreatedBy}}' ricette:${{ matrix.arch }} | head -20 >> "$GITHUB_STEP_SUMMARY" || true

  # These reuse the amd64 layer cache that container-build just wrote, so they do not rebuild.
  container-scan:
    name: container-scan
    needs: [changes, container-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.relevant == 'true'
      - name: Load the amd64 image from cache
        if: needs.changes.outputs.relevant == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ricette:ci
          cache-from: type=gha,scope=amd64
      - name: Generate SBOM
        if: needs.changes.outputs.relevant == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ricette:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.relevant == 'true'
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
      - name: Scan for known vulnerabilities
        if: needs.changes.outputs.relevant == 'true'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ricette:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
          only-fixed: true

  container-acceptance:
    name: container-acceptance
    needs: [changes, container-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.changes.outputs.relevant == 'true'
      - name: Load the amd64 image from cache
        if: needs.changes.outputs.relevant == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ricette:ci
          cache-from: type=gha,scope=amd64
      - run: ./bin/verify container-acceptance
        if: needs.changes.outputs.relevant == 'true'
        env:
          IMAGE: ricette:ci
