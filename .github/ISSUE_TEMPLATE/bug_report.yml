name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do **not** file an Issue: use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image tag
      description: The container image tag or commit you are running.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, PostgreSQL]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: From `docker logs`, with any secrets removed.
      render: shell
