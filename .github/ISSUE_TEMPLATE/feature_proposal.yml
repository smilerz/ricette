name: Feature proposal
description: Suggest a capability or a change
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals are triaged into the Ricette Project as requirements with acceptance criteria. Check existing Issues first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
